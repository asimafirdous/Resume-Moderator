<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Compare a resume with a job description and get ATS keyword suggestions.">
    <title>Resume Moderator | ATS Resume Analysis</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
    <main class="container">
        <header>
            <p class="eyebrow">Resume Moderator</p>
            <h1>Make your resume easier for ATS to read.</h1>
            <p class="intro">Compare your PDF resume with a job description and get focused keyword suggestions.</p>
        </header>

        <form id="resumeForm" novalidate>
            <div class="upload-field">
                <span class="field-label">Resume PDF <span aria-hidden="true">*</span></span>
                <input class="file-input" type="file" id="resume" accept="application/pdf,.pdf" required>
                <label class="file-dropzone" for="resume">
                    <span class="upload-icon" aria-hidden="true">↑</span>
                    <span><strong id="fileName">Choose your resume PDF</strong><small>PDF only · Up to 4 MB · 20 pages maximum</small></span>
                </label>
            </div>

            <div class="field-grid">
                <div>
                    <label for="companyName">Company name <span class="optional">optional</span></label>
                    <input type="text" id="companyName" placeholder="e.g. Acme Inc." autocomplete="organization">
                </div>
                <div>
                    <label for="jobRole">Job title <span class="optional">optional</span></label>
                    <input type="text" id="jobRole" placeholder="e.g. Product Designer" autocomplete="organization-title">
                </div>
            </div>

            <label for="jobDescription">Job description <span aria-hidden="true">*</span></label>
            <textarea id="jobDescription" placeholder="Paste the complete job description here" required minlength="10"></textarea>
            <button id="analyzeButton" type="submit">Analyze resume</button>
        </form>

        <section id="analysis" aria-live="polite">
            <div class="progress" aria-label="ATS score progress"><div id="progressBar" class="progress-bar"></div></div>
            <div id="scoreText"></div>
            <div id="result" role="status"></div>

            <div id="confirmDiv" style="display:none; margin-top:20px;">
                <button type="button" onclick="showOptimizedResume()">Show optimized preview</button>
            </div>

            <div id="optimizedResumeDiv" style="display:none; margin-top:20px;">
                <h2>Optimized resume preview</h2>
                <div class="resume-preview-container"><pre id="optimizedResume"></pre></div>
                <button type="button" onclick="downloadResume()">Download preview as PDF</button>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
